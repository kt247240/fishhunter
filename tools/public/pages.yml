name: Publish FishHunter

# Builds and publishes the public site. The catch-intel collector runs on every
# build (and every 2 hours on schedule) and is bundled as data/intel.json.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and test
        run: |
          node tools/validate.mjs
          node tools/test-engine.mjs
          node tools/test-intel.mjs
      - name: PDF text extractor for 海況情報 (non-blocking)
        continue-on-error: true
        run: pip install --quiet pdfminer.six
      - name: Collect catch intel (non-blocking)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PREV_INTEL_URL: https://kt247240.github.io/fishhunter/data/intel.json
          YOUTUBE_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node tools/intel/collect.mjs data/intel.json
      - name: Data health (opens / updates / closes a GitHub issue)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node tools/intel/health.mjs data > health.md; code=$?
          cat health.md >> "$GITHUB_STEP_SUMMARY"
          title="⚠️ FishHunter データ取得の異常"
          sig=$(grep '^- ' health.md | grep -v '正常\|前回値' | sort | sha1sum | cut -c1-12)
          num=$(gh issue list --state open --search "in:title FishHunter データ取得の異常" --json number --jq '.[0].number // empty')
          if [ "$code" = "2" ]; then
            printf '\n<!-- sig:%s -->\n' "$sig" >> health.md
            if [ -z "$num" ]; then gh issue create --title "$title" --body-file health.md
            elif ! gh issue view "$num" --json body,comments --jq '.body, (.comments[].body)' | grep -q "sig:$sig"; then gh issue comment "$num" --body-file health.md; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "✅ 復旧しました（$(date -u +%FT%TZ)）"
          fi
      - id: pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'tools/' --exclude 'package.json' ./ _site/
          sed -i "s#content=\"assets/og.jpg\"#content=\"${{ steps.pages.outputs.base_url }}/assets/og.jpg\"#" _site/index.html
          ls -la _site/data || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
